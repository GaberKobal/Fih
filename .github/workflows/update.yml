name: Update dive forecast

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "fish_finder.py"
      - "config.json"
      - "regions.json"
      - "species.json"
      - "docs/region-species.json"
      - "weights.json"
      - "exclusions.geojson"
      - "docs/index.html"
      - "docs/anywhere.js"
      - "docs/structure.js"
      - "docs/sw.js"

# Pages is published from a build artifact rather than committed files. With
# several regions the output is a few MB a day, which would bloat the repo
# permanently; this way the site updates and git history stays clean.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued forecast is a stale forecast, and two runs racing collide on the
# Pages deployment API ("due to in progress deployment"). Let the newer run
# supersede the older one rather than wait behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Every region in regions.json is enabled now, and a region that has
    # never been computed has to download its bathymetry first. That happens
    # once, then the cache below carries it, but the first run after adding
    # regions is long and a timeout here loses the WHOLE run: index.json is
    # written at the end, so a kill leaves the site on yesterday's data.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Copernicus Marine (optional)
        continue-on-error: true
        env:
          CMEMS_USER: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
        run: |
          if [ -n "$CMEMS_USER" ]; then
            echo "CMEMS credentials found - installing toolbox"
            pip install -r requirements-cmems.txt || \
              echo "toolbox install failed - continuing without it"
          else
            echo "no CMEMS credentials - skipping (model will use the estimate)"
          fi

      # Bathymetry never changes. Keyed on regions.json so adding a region
      # refetches only what is new.
      - name: Restore bathymetry cache
        uses: actions/cache@v4
        with:
          path: cache
          key: bathy-${{ hashFiles('regions.json', 'config.json') }}
          restore-keys: bathy-

      - name: Run model for every enabled region
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python fish_finder.py

      - name: Sentinel-2 turbidity check (weekly, optional)
        continue-on-error: true
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          if [ -z "$CDSE_CLIENT_ID" ]; then
            echo "no CDSE credentials - skipping"
          elif [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python s2_turbidity.py
          else
            echo "not Monday - skipping (runs weekly, or on a manual run)"
          fi

      - name: Report output size
        run: du -sh docs/data && ls docs/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
