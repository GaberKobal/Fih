name: Update dive forecast

on:
  schedule:
    # 03:40 UTC = 05:40 local in summer, so it is ready before you leave
    - cron: "40 3 * * *"
  workflow_dispatch:        # the "Run workflow" button, works from the phone app
  push:
    paths:
      - "fish_finder.py"
      - "config.json"
      - "weights.json"
      - "exclusions.geojson"

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Only pulled in if you have set up the Copernicus Marine secrets.
      # The check is done in the shell, not in an `if:` expression: a step
      # cannot reliably read its own step-level env in its own condition,
      # which would make this skip silently even with the secrets set.
      - name: Install Copernicus Marine (optional)
        continue-on-error: true
        env:
          CMEMS_USER: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
        run: |
          if [ -n "$CMEMS_USER" ]; then
            echo "CMEMS credentials found - installing toolbox"
            # An optional extra must never break the forecast. If the resolver
            # fights with numpy 2.x, log it and carry on with the estimate.
            pip install -r requirements-cmems.txt || \
              echo "toolbox install failed - continuing without it"
          else
            echo "no CMEMS credentials - skipping (model will use the estimate)"
          fi

      # Bathymetry never changes, so EMODnet is queried once and then reused.
      - name: Restore bathymetry cache
        uses: actions/cache@v4
        with:
          path: cache
          key: bathy-${{ hashFiles('config.json') }}

      - name: Run model
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python fish_finder.py

      # Sentinel-2 passes every ~5 days and is often clouded out, so this
      # runs weekly and is allowed to find nothing without failing the job.
      - name: Sentinel-2 turbidity check (weekly, optional)
        continue-on-error: true
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          if [ -z "$CDSE_CLIENT_ID" ]; then
            echo "no CDSE credentials - skipping"
          elif [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python s2_turbidity.py
          else
            echo "not Monday - skipping (runs weekly, or on a manual run)"
          fi

      - name: Commit outputs
        run: |
          git config user.name  "fish-finder"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi

          # If you upload a file while this job is running, main moves under
          # us and the push is rejected. These are generated files, so the
          # freshest forecast always wins: fetch, replay our staged changes on
          # top of whatever landed, and try again.
          for attempt in 1 2 3; do
            git commit -q -m "forecast $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected - main moved, replaying onto it (attempt $attempt)"
            git fetch -q origin main
            git reset -q --soft origin/main   # keep our files staged, drop our commit
            git add docs/data
            if git diff --staged --quiet; then
              echo "nothing left to commit after refresh"
              exit 0
            fi
          done
          echo "could not push after 3 attempts"
          exit 1
