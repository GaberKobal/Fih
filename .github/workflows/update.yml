name: Update dive forecast

on:
  schedule:
    # Every 4 hours, six runs a day. Offset off the hour because scheduled
    # workflows queue behind everyone else's on the hour and get delayed.
    #
    # Worth knowing what this does and does not buy. The app re-anchors "now"
    # to the real clock from the hourly series in the file it already has
    # (reanchorNow() in docs/index.html), so a several-hour-old file still
    # reports the CURRENT hour correctly — staleness was never the problem
    # this solves. What a fresh run actually buys is a newer upstream model
    # run and a forecast horizon that reaches further out.
    - cron: "40 3,7,11,15,19,23 * * *"
  workflow_dispatch:
    inputs:
      regions:
        description: >-
          Which regions to compute: comma-separated ids and/or group names
          (see `python fish_finder.py --groups`), or "all", or "enabled" to
          use the flags in regions.json. Leave blank for "enabled".
        required: false
        default: ""
      jobs:
        description: "Regions to compute at once (4 is a good default)"
        required: false
        default: "4"
  push:
    paths:
      - "fish_finder.py"
      - "config.json"
      - "regions.json"
      - "species.json"
      - "docs/region-species.json"
      - "weights.json"
      - "exclusions.geojson"
      - "docs/index.html"
      - "docs/anywhere.js"
      - "docs/structure.js"
      - "docs/sw.js"

# Pages is published from a build artifact rather than committed files. With
# several regions the output is a few MB a day, which would bloat the repo
# permanently; this way the site updates and git history stays clean.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued forecast is a stale forecast, and two runs racing collide on the
# Pages deployment API ("due to in progress deployment"). Let the newer run
# supersede the older one rather than wait behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A region that has never been computed downloads its bathymetry and
    # coastline first: ~32 s at 6 workers against ~2.5 s once cached. Turning
    # on all 264 at once is therefore a 2-3 hour job, and 180 minutes left
    # only ~17 minutes of headroom at the default worker count.
    #
    # A timeout is no longer catastrophic — index.json is rewritten as each
    # region lands and model.json is written before any of them, so a killed
    # run leaves a smaller but perfectly good site, and the next run picks up
    # the cached regions in seconds. Still worth the headroom: the ceiling
    # for a GitHub-hosted job is 360 minutes.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against github.event.before and tell a
          # frontend-only push from one that changes the model.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Copernicus Marine (optional)
        continue-on-error: true
        env:
          CMEMS_USER: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
        run: |
          if [ -n "$CMEMS_USER" ]; then
            echo "CMEMS credentials found - installing toolbox"
            pip install -r requirements-cmems.txt || \
              echo "toolbox install failed - continuing without it"
          else
            echo "no CMEMS credentials - skipping (model will use the estimate)"
          fi

      # Bathymetry, coastlines and wrecks never change, so they are fetched
      # once per region and reused forever. Getting that right is the whole
      # difference between a run costing 11 minutes and a run costing hours.
      #
      # The key is the RUN ID on purpose, not a hash of regions.json.
      # actions/cache skips the save step entirely when the key hits exactly,
      # and the key used to be a hash of regions.json + config.json — so
      # turning a group on through the FISH_REGIONS variable, which by design
      # changes no file, produced an exact hit: the run downloaded 38 cold
      # bathymetries, threw them away at the end, and did it again on the
      # next run, forever. A unique key never hits exactly, so the cache is
      # always written back and every region stays cold exactly once.
      #
      # restore-keys pulls the most recent previous cache. GitHub evicts
      # least-recently-used entries past 10 GB a repository; at roughly
      # 1.4 MB a region a full 264-region cache is about 370 MB, so a couple
      # of weeks of history fits comfortably.
      - name: Restore bathymetry, coastline and wreck cache
        uses: actions/cache@v4
        with:
          # docs/data rides along on purpose. It is gitignored — it only ever
          # exists as a build artifact — so without a copy of the last run's
          # output there is nothing to publish, and every change to the page
          # had to recompute every enabled region from scratch just to have
          # a site to deploy. Carrying it here is what lets a frontend-only
          # push skip the model entirely (see below).
          path: |
            cache
            docs/data
          key: bathy-${{ github.run_id }}
          restore-keys: bathy-

      # A change to index.html does not change the forecast. Work out whether
      # anything that actually feeds the model moved; if not, publish the
      # restored output with the new page and skip the run.
      #
      # Fails safe in every direction: an unreadable diff, an empty diff, a
      # first push on a new branch, a missing cache — all fall through to
      # running the model.
      - name: Decide whether the model needs to run
        id: plan
        run: |
          set -u
          RUN=true
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" || true)
            else
              CHANGED=$(git show --name-only --pretty=format: "${{ github.sha }}" || true)
            fi
            CHANGED=$(echo "$CHANGED" | sed '/^$/d')
            echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'
            FRONTEND='^docs/(index\.html|anywhere\.js|structure\.js|sw\.js|add-region\.html|region-species\.json)$|^README\.md$'
            if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qvE "$FRONTEND"; then
              if [ -f docs/data/index.json ]; then
                RUN=false
                echo "→ frontend-only change and a cached forecast exists: skipping the model"
              else
                echo "→ frontend-only change but no cached forecast: running the model anyway"
              fi
            fi
          fi
          echo "run_model=$RUN" >> "$GITHUB_OUTPUT"
          echo "→ run_model=$RUN"

      # Which regions run, in order of precedence:
      #   1. the `regions` input, when the workflow is started by hand
      #   2. the FISH_REGIONS repository variable (Settings -> Variables),
      #      which is how the SCHEDULED run gets repointed at a group without
      #      a commit — set it to e.g. "med-west,adriatic" or "all"
      #   3. otherwise, whatever has "enabled": true in regions.json
      - name: Run model
        if: steps.plan.outputs.run_model == 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          FISH_REGIONS: ${{ github.event.inputs.regions || vars.FISH_REGIONS || '' }}
          FISH_JOBS: ${{ github.event.inputs.jobs || vars.FISH_JOBS || '4' }}
        run: python fish_finder.py

      - name: Reusing the cached forecast
        if: steps.plan.outputs.run_model == 'false'
        run: |
          echo "Frontend-only change — the model did not run."
          python - <<'PY'
          import json, datetime as dt
          d = json.load(open("docs/data/index.json", encoding="utf-8"))
          age = (dt.datetime.now(dt.timezone.utc)
                 - dt.datetime.fromisoformat(d["generated"])).total_seconds() / 3600
          print(f"  publishing {len(d['regions'])} region(s) from a forecast "
                f"{age:.1f} h old")
          print( "  the next scheduled run refreshes it (every 4 h)")
          PY

      - name: Sentinel-2 turbidity check (weekly, optional)
        if: steps.plan.outputs.run_model == 'true'
        continue-on-error: true
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          if [ -z "$CDSE_CLIENT_ID" ]; then
            echo "no CDSE credentials - skipping"
          elif [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python s2_turbidity.py
          else
            echo "not Monday - skipping (runs weekly, or on a manual run)"
          fi

      # GitHub Pages will not publish a site over 1 GB, and the artifact
      # upload slows down badly well before that. At roughly 400 KB per
      # region that is a hard ceiling near 2500 regions and an uncomfortable
      # one near 1000 — worth seeing in the log while the catalogue grows,
      # rather than discovering it on the day a deploy starts failing.
      - name: Report output size
        run: |
          du -sh docs/data
          echo "regions: $(ls -1 docs/data | grep -v '\.json$' | wc -l)"
          echo "files:   $(find docs/data -type f | wc -l)"
          echo "--- cache (must GROW when new regions run, then stay flat) ---"
          du -sh cache 2>/dev/null || echo "no cache"
          echo "bathymetry grids cached: $(ls -1 cache/bathy_* 2>/dev/null | wc -l)"
          echo "coastlines cached:       $(ls -1 cache/coastline_* 2>/dev/null | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
