name: Update dive forecast

on:
  schedule:
    # 03:40 UTC = 05:40 local in summer, so it is ready before you leave
    - cron: "40 3 * * *"
  workflow_dispatch:        # the "Run workflow" button, works from the phone app
  push:
    paths:
      - "fish_finder.py"
      - "config.json"
      - "weights.json"
      - "exclusions.geojson"

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bathymetry never changes, so EMODnet is queried once and then reused.
      - name: Restore bathymetry cache
        uses: actions/cache@v4
        with:
          path: cache
          key: bathy-${{ hashFiles('config.json') }}

      - name: Run model
        run: python fish_finder.py

      - name: Commit outputs
        run: |
          git config user.name  "fish-finder"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "forecast $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
