name: Append dive log

# The site cannot write to the repo, so the "Log a dive" form opens a
# prefilled issue instead. This picks it up, appends the row to
# dive_log.csv, and closes the issue. No token ever touches the browser.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  append:
    if: contains(github.event.issue.labels.*.name, 'dive-log')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append row to dive_log.csv
        id: append
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 <<'PY'
          import csv, os, pathlib, re, sys

          body = os.environ.get("BODY") or ""
          m = re.search(r"```(?:csv)?\s*\n(.*?)\n```", body, re.S)
          if not m:
              print("::error::no fenced CSV block found in the issue body")
              sys.exit(1)
          row = m.group(1).strip().splitlines()[0].strip()

          path = pathlib.Path("dive_log.csv")
          header = path.read_text().splitlines()[0].split(",")
          fields = next(csv.reader([row]))
          if len(fields) != len(header):
              print(f"::error::row has {len(fields)} fields, header has {len(header)}")
              sys.exit(1)
          if not fields[0].strip():
              print("::error::the date field is empty")
              sys.exit(1)

          with path.open("a", newline="") as f:
              csv.writer(f).writerow(fields)
          n = sum(1 for _ in open(path)) - 1
          print(f"appended: {row}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"row={row}\ntotal={n}\n")
          PY

      - name: Commit
        run: |
          git config user.name  "fish-finder"
          git config user.email "actions@users.noreply.github.com"
          git add dive_log.csv
          git diff --staged --quiet && exit 0
          git commit -q -m "dive log: ${{ steps.append.outputs.row }}"
          for i in 1 2 3; do
            git push && exit 0
            git fetch -q origin main && git reset -q --soft origin/main && git add dive_log.csv
            git diff --staged --quiet && exit 0
            git commit -q -m "dive log entry"
          done
          exit 1

      - name: Close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "Logged. dive_log.csv now has ${{ steps.append.outputs.total }} rows."
          gh issue close ${{ github.event.issue.number }}
